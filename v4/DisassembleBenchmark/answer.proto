// proto3 mirror of the AnswerBenchmark POCO graph for the OFFICIAL Google.Protobuf
// runtime, which serializes only its protoc-generated message types — the benchmark's
// shared-POCO principle does not apply to this entry (measured on a pre-mapped message;
// AnswerProtoMap converts to/from the POCO for the roundtrip verification only).
// Field numbers match protobuf-net's ProtoMember (= MessagePack Key + 1); DateTime maps
// to google.protobuf.Timestamp (same as protobuf-net's CompatibilityLevel240); nullable
// strings map to `optional string` so presence (null) survives the roundtrip.
syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "AnswerProto";

message Answer {
  int32 question_id = 1;
  int32 answer_id = 2;
  google.protobuf.Timestamp locked_date = 3;
  google.protobuf.Timestamp creation_date = 4;
  google.protobuf.Timestamp last_edit_date = 5;
  google.protobuf.Timestamp last_activity_date = 6;
  int32 score = 7;
  google.protobuf.Timestamp community_owned_date = 8;
  bool is_accepted = 9;
  optional string body = 10;
  ShallowUser owner = 11;
  optional string title = 12;
  int32 up_vote_count = 13;
  int32 down_vote_count = 14;
  repeated Comment comments = 15;
  optional string link = 16;
  repeated string tags = 17;
  bool upvoted = 18;
  bool downvoted = 19;
  bool accepted = 20;
  ShallowUser last_editor = 21;
  int32 comment_count = 22;
  optional string body_markdown = 23;
  optional string share_link = 24;
}

message Comment {
  int32 comment_id = 1;
  int32 post_id = 2;
  google.protobuf.Timestamp creation_date = 3;
  PostType post_type = 4;
  int32 score = 5;
  bool edited = 6;
  optional string body = 7;
  ShallowUser owner = 8;
  ShallowUser reply_to_user = 9;
  optional string link = 10;
  optional string body_markdown = 11;
  bool upvoted = 12;
}

message ShallowUser {
  int32 user_id = 1;
  optional string display_name = 2;
  int32 reputation = 3;
  UserType user_type = 4;
  optional string profile_image = 5;
  optional string link = 6;
  int32 accept_rate = 7;
  BadgeCount badge_counts = 8;
}

message BadgeCount {
  int32 gold = 1;
  int32 silver = 2;
  int32 bronze = 3;
}

// proto3 requires a zero enum value; the POCO enums start at 1/2, so a *_UNSPECIFIED
// placeholder is added and values are mapped by numeric cast
enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_UNREGISTERED = 2;
  USER_TYPE_REGISTERED = 3;
  USER_TYPE_MODERATOR = 4;
  USER_TYPE_DOES_NOT_EXIST = 255;
}

enum PostType {
  POST_TYPE_UNSPECIFIED = 0;
  POST_TYPE_QUESTION = 1;
  POST_TYPE_ANSWER = 2;
}
