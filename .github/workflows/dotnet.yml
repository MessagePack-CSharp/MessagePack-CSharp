name: Run .NET Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - v4
  pull_request:
    branches:
      - master
      - develop
      - v4

jobs:
  build-dotnet:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet build -c Release -t:build,pack
      - run: dotnet test -c Release --no-build
      # the packages as a consumer gets them (tests/PackageSmoke): the packaged source generator, the Annotations shim's
      # forwarders against a v3-built library, the compression packages' native dependencies. Every other test project
      # uses ProjectReference, so this is the only place the nupkgs themselves are exercised.
      - run: dotnet pack MessagePack.Release.slnf -c Release -o ./smoke-feed -p:Version=4.0.0-smoke
      - run: dotnet run --project tests/PackageSmoke/App/App.csproj -c Release -p:SmokeVersion=4.0.0-smoke -p:SmokeFeed=$GITHUB_WORKSPACE/smoke-feed

  # The netstandard2.0 assets of MessagePack, MessagePack.LZ4 and MessagePack.Zstandard are what .NET Framework loads,
  # and the net48 test project is the only thing that executes them; it is Windows-only (IsTestProject is false
  # elsewhere), so the Linux job above never runs it.
  test-netfx:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet test tests/MessagePack.Tests.NetFx/MessagePack.Tests.NetFx.csproj -c Release

  # Native AOT: MessagePack.Tests.NativeAot runs under the JIT in the job above; only a publish runs ILC's whole-program
  # analysis (IL2xxx/IL3xxx) and the AOT-compiled tests themselves. MessagePack.AotCompatibilityTest roots every
  # shipped assembly for the trimmer so the entire API surface is analyzed. IlcTreatWarningsAsErrors makes any IL warning
  # fail the job (TreatWarningsAsErrors itself would also promote NuGet audit and analyzer warnings of every project).
  publish-aot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish tests/MessagePack.AotCompatibilityTest/MessagePack.AotCompatibilityTest.csproj -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true
      # The plain build first: xunit's MTP props force UseAppHost=true, but under a PublishAot publish the SDK neither
      # restores the net10.0 host pack nor creates the apphost (ILC makes the executable), so the publish build fails
      # with MSB3030 unless the host pack version the SDK pins happens to be in the runner's packs folder. The plain
      # build restores that pack and leaves the apphost in obj, which the publish build then finds.
      - run: dotnet build tests/MessagePack.Tests.NativeAot/MessagePack.Tests.NativeAot.csproj -c Release -r linux-x64
      - run: dotnet publish tests/MessagePack.Tests.NativeAot/MessagePack.Tests.NativeAot.csproj -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true
      - run: ./tests/MessagePack.Tests.NativeAot/bin/Release/net10.0/linux-x64/publish/MessagePack.Tests.NativeAot
