name: Run .NET Build and Test

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop

jobs:
  build-dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
    - uses: ./.github/actions/setup-dotnet
    - run: dotnet build -c Release -t:build,pack -warnaserror
    - run: dotnet test -c Release --no-build

  security-nativeaot:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          rid: linux-x64
        - os: windows-latest
          rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-dotnet
    - name: Verify legacy JIT comparer dispatch
      run: dotnet run --project tests/MessagePack.Security.NativeAotTests -c Release -p:PublishAot=false -p:NonReflectiveSecurity=false -- legacy
    - name: Verify non-reflective JIT comparer dispatch
      run: dotnet run --project tests/MessagePack.Security.NativeAotTests -c Release -p:PublishAot=false -p:NonReflectiveSecurity=true -- opt-in
    - name: Publish non-reflective NativeAOT comparer tests
      run: dotnet publish tests/MessagePack.Security.NativeAotTests -c Release -r ${{ matrix.rid }} -p:NonReflectiveSecurity=true -warnaserror -o bin/security-native
    - name: Run non-reflective NativeAOT comparer tests
      shell: pwsh
      run: |
        $executable = Join-Path $PWD 'bin/security-native/MessagePack.Security.NativeAotTests'
        if ($IsWindows) { $executable += '.exe' }
        & $executable opt-in
        exit $LASTEXITCODE
