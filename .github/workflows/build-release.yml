name: Run release build and publish to NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample v1.0.0)"
        required: true
      dry-run:
        description: "dry-run: false = create release/nuget. true = never create release/nuget."
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  # for unity. need update package.json from tag
  update-packagejson:
    uses: ./.github/workflows/_update-packagejson.yaml
    permissions:
      contents: write
    with:
      file-path: |
        ./src/MessagePack.Unity/package.json
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry-run }}
      push-tag: true

  # for dotnet. Build nuget package
  build-dotnet:
    needs: [update-packagejson]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - run: echo ${{ needs.update-packagejson.outputs.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.update-packagejson.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet
      # pack nuget. The release builds the solution filter (src, tests, tools), not the sandbox projects
      - run: dotnet build MessagePack.Release.slnf -c Release -p:Version=${{ needs.update-packagejson.outputs.normalized_tag }}
      - run: dotnet test MessagePack.Release.slnf -c Release --no-build
      - run: dotnet pack MessagePack.Release.slnf -c Release -p:Version=${{ needs.update-packagejson.outputs.normalized_tag }} -o ./publish -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      # the packages that are about to be published, restored and run as a consumer (tests/PackageSmoke)
      - run: dotnet run --project tests/PackageSmoke/App/App.csproj -c Release -p:SmokeVersion=${{ needs.update-packagejson.outputs.normalized_tag }} -p:SmokeFeed=$GITHUB_WORKSPACE/publish
      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # must sync with actions/download-artifact@v8 in create-release
        with:
          name: nuget
          path: ./publish/
          if-no-files-found: "error" # default 'warn'
          retention-days: 1 # expire in 1 day

  # the netstandard2.0 assets on .NET Framework, from the same commit (Windows only, see dotnet.yml)
  test-netfx:
    needs: [update-packagejson]
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.update-packagejson.outputs.sha }}
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet test tests/MessagePack.Tests.NetFx/MessagePack.Tests.NetFx.csproj -c Release

  # Native AOT publish with IL warnings as errors, and the AOT-compiled tests, from the same commit (see dotnet.yml)
  publish-aot:
    needs: [update-packagejson]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.update-packagejson.outputs.sha }}
      - uses: ./.github/actions/setup-dotnet
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish tests/MessagePack.AotCompatibilityTest/MessagePack.AotCompatibilityTest.csproj -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true
      # The plain build first: xunit's MTP props force UseAppHost=true, but under a PublishAot publish the SDK neither
      # restores the net10.0 host pack nor creates the apphost (ILC makes the executable), so the publish build fails
      # with MSB3030 unless the host pack version the SDK pins happens to be in the runner's packs folder. The plain
      # build restores that pack and leaves the apphost in obj, which the publish build then finds.
      - run: dotnet build tests/MessagePack.Tests.NativeAot/MessagePack.Tests.NativeAot.csproj -c Release -r linux-x64
      - run: dotnet publish tests/MessagePack.Tests.NativeAot/MessagePack.Tests.NativeAot.csproj -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true
      - run: ./tests/MessagePack.Tests.NativeAot/bin/Release/net10.0/linux-x64/publish/MessagePack.Tests.NativeAot

  # create release and upload nuget: only after every check above passed on this commit
  create-release:
    needs: [update-packagejson, build-dotnet, test-netfx, publish-aot]
    uses: ./.github/workflows/_create-release.yaml
    permissions:
      contents: write
      id-token: write
    with:
      commit-id: ${{ needs.update-packagejson.outputs.sha }}
      dry-run: ${{ inputs.dry-run }}
      nuget-push: true
      release-upload: true
      release-asset-path: |
        ./nuget/*.nupkg
        ./nuget/*.snupkg
      tag: ${{ inputs.tag }}
    secrets: inherit

  # delete dry-run created git branch
  cleanup:
    if: ${{ always() && needs.update-packagejson.outputs.is-branch-created == 'true' }}
    needs: [update-packagejson, create-release]
    uses: ./.github/workflows/_clean-packagejson-branch.yaml
    permissions:
      contents: write
    with:
      branch: ${{ needs.update-packagejson.outputs.branch-name }}
