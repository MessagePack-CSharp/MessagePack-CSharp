name: (R) Create Release

on:
  workflow_call:
    inputs:
      commit-id:
        description: "CommitId to create release & tag."
        required: true
        type: string
      dry-run:
        description: "true = no upload. false = dry run changes && delete release after 60s."
        required: true
        type: boolean
      tag:
        description: "Git tag to create. (sample 1.0.0)"
        required: true
        type: string
      # nuget
      nuget-path:
        description: "nuget path to upload."
        required: false
        type: string
        default: |
          ./nuget/*.nupkg
          ./nuget/*.snupkg
      nuget-push:
        description: "true = upload nuget package. false = not upload"
        required: false
        type: boolean
        default: false
      # release
      release-asset-path:
        description: "release assets path to upload. This is a list of paths separated by a newline."
        required: false
        type: string
      release-upload:
        description: "true = upload assets. false = not upload"
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    name: Create Release
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto generated token
      GH_REPO: ${{ github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate inputs - unitypackage
        shell: bash
        if: ${{ inputs.release-upload && inputs.release-asset-path == '' }}
        run: |
          echo "Validation error! 'inputs.release-asset-path' cannot be blank when 'inputs.release-upload' is true."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit-id }}
      - uses: ./.github/actions/setup-dotnet

      # Download(All) Artifacts to $GITHUB_WORKSPACE
      - name: download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 # must sync with actions/upload-artifact@v7 in build-release
        with:
          name: nuget
          path: ./nuget
      - name: Show download aritifacts
        run: ls -lR
      - name: Validate package exists in artifact - release assets
        if: ${{ inputs.release-upload }}
        run: |
          while read -r asset_path; do
            if [[ "${asset_path}" == "" ]]; then continue; fi
            # is it a wildcard?
            # shellcheck disable=SC2086
            if [[ "$asset_path" == *\** || "$asset_path" == *\?* ]]; then
              # shellcheck disable=SC2086
              if ! ls -l ${asset_path}; then
                echo "Specified nuget package not found. path: $asset_path"
                if [[ "${asset_path}" == *.nupkg ]]; then
                  echo ".nupkg must be included in the artifact."
                  exit 1
                fi
              fi
              continue
            fi
            # is it a file?
            if [[ ! -f "${asset_path}" ]]; then
              echo "Specified asset not found. path: ${asset_path}"
              exit 1
            fi
          done <<< "${RELEASE_ASSET_PATH}"
        env:
          RELEASE_ASSET_PATH: ${{ inputs.release-asset-path }}
      - name: Validate package exists in artifact - NuGet
        if: ${{ inputs.nuget-push }}
        run: |
          while read -r nuget_path; do
            if [[ "${nuget_path}" == "" ]]; then continue; fi
            # shellcheck disable=SC2086
            if ! ls -l ${nuget_path}; then
              echo "Specified nuget package not found. path: $nuget_path"
              if [[ "${nuget_path}" == *.nupkg ]]; then
                echo ".nupkg must be included in the artifact."
                exit 1
              fi
            fi
          done <<< "${NUGET_PATH}"

        env:
          NUGET_PATH: ${{ inputs.nuget-path }}
      # Create Releases
      # each step records what it created so the cleanup below deletes exactly that: a re-run that fails on an
      # existing tag must leave the earlier draft release of the same tag alone
      - name: Create Tag
        id: create-tag
        if: ${{ !inputs.dry-run }}
        run: |
          gh auth setup-git
          # a tag that already exists on the remote (a re-run) is not this run's to create, nor to delete on failure,
          # and the packages of this run must be the ones built from the commit it points at
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            existing=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)
            existing=${existing:-$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)}
            if [[ "${existing}" != "$(git rev-parse HEAD)" ]]; then
              echo "tag ${TAG} already exists on origin at ${existing}, but this run builds $(git rev-parse HEAD); a version is published from one commit only"
              exit 1
            fi
            echo "tag ${TAG} already exists on origin at this commit; leaving it as it is"
          else
            git tag ${TAG}
            git push origin ${TAG}
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ inputs.tag }}
      - name: Create Release
        id: create-release
        if: ${{ !inputs.dry-run }}
        # a SemVer pre-release tag (v4.0.0-preview.1) is a GitHub pre-release, so publishing the draft never lists it as the latest stable
        run: |
          if [[ "${TAG}" == *-* ]]; then prerelease="--prerelease"; else prerelease=""; fi
          gh release create ${TAG} --draft --verify-tag --title "${TAG}" --generate-notes ${prerelease}
          echo "created=true" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - name: Wait and Verify Release Name is expected
        if: ${{ !inputs.dry-run }}
        run: |
          sleep 5s
          actual=$(gh api --paginate /repos/${{ github.repository }}/releases?per_page=100 --jq '.[] | select(.tag_name == "${{ inputs.tag }}") | .name')
          expected="${TAG}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release name is not as expected. expected: $expected, actual: $actual"
            exit 1
          else
            echo "Release name is expected! expected: $expected, actual: $actual"
          fi
        env:
          TAG: ${{ inputs.tag }}
      - name: Upload asset files to release
        run: |
          while read -r asset_path; do
            if [[ "${asset_path}" == "" ]]; then continue; fi
            # is it a wildcard?
            # shellcheck disable=SC2086
            if [[ "$asset_path" == *\** || "$asset_path" == *\?* ]]; then
              for file in ${asset_path}; do
                gh release upload ${TAG} "${file}"
              done
              continue
            fi
            # is it a file?
            gh release upload ${TAG} "${asset_path}"
          done <<< "${RELEASE_ASSET_PATH}"
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_ASSET_PATH: ${{ inputs.release-asset-path }}
        if: ${{ inputs.release-upload && !inputs.dry-run }}

      - name: NuGet login (OIDC)
        id: nuget-login
        if: ${{ inputs.nuget-push }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Upload to NuGet
      - name: Upload to NuGet (DryRun=${{ inputs.dry-run }})
        id: nuget-push
        if: ${{ inputs.nuget-push }}
        run: |
          while read -r nuget_path; do
            if [[ "$nuget_path" == "" ]]; then continue; fi
            # shellcheck disable=SC2086
            if ! ls -l ${nuget_path} >/dev/null 2>&1;then
              echo "skipping nuget push, $nuget_path not found."
              continue
            fi

            if [[ "${{ inputs.dry-run }}" == "true" ]]; then
              echo "(dry run) dotnet nuget push \"${nuget_path}\" --skip-duplicate -s https://api.nuget.org/v3/index.json -k \"***\""
            else
              # from the first push on, packages of this version may be public: the cleanup keeps the tag and release
              echo "started=true" >> "$GITHUB_OUTPUT"
              dotnet nuget push "${nuget_path}" --skip-duplicate -s https://api.nuget.org/v3/index.json -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
            fi
          done <<< "${{ inputs.nuget-path }}"

      # Clean up
      # only what this run created is deleted (a dry run creates nothing; a run that failed before its tag or release
      # existed created nothing either, and a pre-existing draft of the same tag is not ours to remove), and nothing is
      # deleted once a package push has started: a published package pins the version to this commit, so the tag and
      # the draft stay for the operator to finish by hand
      - name: Clean up. Wait 60s and delete the release and tag this run created when it failed. (dry-run=${{ inputs.dry-run }})
        if: ${{ failure() && !inputs.dry-run && steps.nuget-push.outputs.started != 'true' && (steps.create-release.outputs.created == 'true' || steps.create-tag.outputs.created == 'true') }}
        run: |
          sleep 60
          if [[ "${RELEASE_CREATED}" == "true" ]]; then
            gh release delete ${TAG} --yes
          fi
          # the tag is deleted only when this run pushed it (a release created on a pre-existing tag leaves that tag)
          if [[ "${TAG_CREATED}" == "true" ]]; then
            git push --delete origin ${TAG}
          fi
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.create-release.outputs.created }}
          TAG_CREATED: ${{ steps.create-tag.outputs.created }}
